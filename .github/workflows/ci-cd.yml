name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1: TESTES ───────────────────────────────────────────────
  test:
    name: Rodar Testes
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:5
        ports:
          - 27017:27017

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/contacts-app-test
          PORT: 3000

  # ─── JOB 2: DEPLOY (só roda se os testes passarem) ───────────────
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: test                  # aguarda o job de testes terminar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger deploy no Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"